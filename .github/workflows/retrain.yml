name: Retrain model

# Started by hand from the Actions tab. Rebuilds the model from the raw data with the tuned
# hyperparameters, applies the quality gate, and uploads the candidate model and its metrics.
# Promotion into the repository is a separate, deliberate step (download the artifact, review, commit).
on:
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl==3.1.5
      - name: Run pipeline (prepare, train, quality gate)
        run: python run_pipeline.py --promote
      - name: Show metrics
        if: always()
        run: cat artifacts/metrics.json
      - name: Upload candidate model and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: |
            artifacts/land_price_model.pkl
            artifacts/ngboost_model.pkl
            artifacts/metrics.json
